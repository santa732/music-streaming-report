name: Daily Music Report Automation

on:
  schedule:
    # Jalan otomatis setiap jam 08.00 WIB (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Supaya bisa dijalankan manual kapan saja dari GitHub

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Script
        run: python Auto.py
